services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/app.db
      PUBLIC_BASE_URL: http://localhost:8000
      WX_MOCK: "true"
      CELERY_EAGER: "true"
      SCHEDULER_INPROCESS: "true"
    volumes:
      - app-data:/data
      - ./backend/data:/app/data
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    image: node:22-alpine
    working_dir: /src
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    volumes: ["./web:/src"]
    depends_on: [api]

  admin:
    image: node:22-alpine
    working_dir: /src
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports: ["5174:5174"]
    volumes: ["./admin:/src"]
    depends_on: [api]

volumes:
  app-data:
